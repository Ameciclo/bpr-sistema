[env:seeed_xiao_esp32c3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
board_build.filesystem = littlefs
; F25: tabela 4 MiB com app de 3 MiB
board_build.partitions = partitions.csv

; Otimizações para baixo consumo
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=512
    -Os
    -I../common

lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@6.21.6

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Configurações de upload
upload_speed = 115200
; upload_port será definido pelo script
; monitor_port será definido pelo script
